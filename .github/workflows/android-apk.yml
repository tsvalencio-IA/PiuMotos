name: Gerar APK Android - Controle de Motos Piu

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:clean :app:assembleDebug --stacktrace --warning-mode all 2>&1 | tee build-apk.log

      - name: Auditoria Lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:lintDebug --stacktrace 2>&1 | tee lint.log

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CONTROLE-MOTOS-PIU-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar logs de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CONTROLE-MOTOS-PIU-LOGS
          path: |
            build-apk.log
            lint.log
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
