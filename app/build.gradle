plugins { id 'com.android.application' }

android {
    namespace 'com.thiaguinho.controlemotospiu'
    compileSdk 35

    defaultConfig {
        applicationId 'com.thiaguinho.controlemotospiu'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.1.1'
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Compatibilidade das dependências Kotlin transitivas do AndroidX.
// Kotlin 1.8+ incorporou as classes que antes ficavam nos módulos jdk7/jdk8.
// Excluir os módulos antigos evita Duplicate class no GitHub Actions.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'

    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
